<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=95;
        if(a>=90){
            document.write("Grade A+")
        }
        else if(a>=80){
            document.write("Grade A")
        }
        else if(a>=70){
            document.write("Grade B")
        }
        else{
            document.write("Grade C")
        }
    </script>
</body>
</html>
