<!DOCTYPE html>
<html>
<head>
    <title>Largest Number Finder</title>
    <link rel="stylesheet" href="externalpratical.css">
</head>
<body>
    <h2>Largest Number Finder</h2>

    Number 1: <input type="number" id="n1"><br><br>
    Number 2: <input type="number" id="n2"><br><br>
    Number 3: <input type="number" id="n3"><br><br>
    Number 4: <input type="number" id="n4"><br><br>
    Number 5: <input type="number" id="n5"><br><br>

    <button onclick="findLargest()">Find Largest</button>

    <h3 id="result"></h3>

    <script>
        function findLargest() {
            let a = Number(document.getElementById("n1").value);
            let b = Number(document.getElementById("n2").value);
            let c = Number(document.getElementById("n3").value);
            let d = Number(document.getElementById("n4").value);
            let e = Number(document.getElementById("n5").value);

            let largest;

            if (a >= b && a >= c && a >= d && a >= e) {
                largest = a;
            }
            else if (b >= a && b >= c && b >= d && b >= e) {
                largest = b;
            }
            else if (c >= a && c >= b && c >= d && c >= e) {
                largest = c;
            }
            else if (d >= a && d >= b && d >= c && d >= e) {
                largest = d;
            }
            else {
                largest = e;
            }

            document.getElementById("result").innerHTML =
                "Largest Number = " + largest;
        }
    </script>
</body>
</html>
