<!DOCTYPE html>
<html>
<head>
<title>Palindrome</title>
</head>

<body>

<script>

let num=121;

let original=num;

let reverse=0;

while(num>0)
{
reverse=reverse*10+(num%10);

num=Math.floor(num/10);
}

if(original==reverse)
{
console.log("Palindrome");
}
else
{
console.log("Not Palindrome");
}

</script>

</body>
</html>
